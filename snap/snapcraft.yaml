name: pocketbase
base: core26
version: '0.40.6'
title: PocketBase
summary: Backend with an embedded database, authentication and file storage
description: |
  PocketBase provides a SQLite database, authentication, file storage,
  realtime subscriptions and a web dashboard in one application.

  The service starts on 127.0.0.1:8090. Create the first administrator:

     sudo pocketbase superuser create admin@example.com 'your-password'

  Open http://localhost:8090/_/ to manage the application. Data, hooks,
  migrations and static files are stored under /var/snap/pocketbase/common.

  To listen on your network:

     sudo snap set pocketbase address=0.0.0.0:8090

  Use SMTP for email and a reverse proxy for HTTPS. Updates come through
  snap refresh; the upstream self-update command is not included.
license: MIT
grade: stable
confinement: strict
website: https://pocketbase.io
source-code: https://github.com/pocketbase/pocketbase
issues: https://github.com/pocketbase/pocketbase/issues
contact: https://github.com/sidalit/pocketbase-snap/issues

platforms:
  amd64:
  arm64:

apps:
  pocketbase:
    command: bin/pocketbase-cli
    plugs:
      - network
      - network-bind
  daemon:
    command: bin/pocketbase-launch
    daemon: simple
    restart-condition: on-failure
    plugs:
      - network
      - network-bind

parts:
  pocketbase:
    plugin: nil
    source: https://github.com/pocketbase/pocketbase.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-snaps:
      - go/1.27/stable
    build-packages:
      - git
    build-environment:
      - CGO_ENABLED: '0'
      - GOTOOLCHAIN: local
    override-build: |
      # The installed executable is read-only; updates are managed by snapd.
      sed -i '\|"github.com/pocketbase/pocketbase/plugins/ghupdate"|d; /ghupdate.MustRegister(app, app.RootCmd, ghupdate.Config{})/d' examples/base/main.go

      # Upstream commits the dashboard in ui/dist and embeds it in this binary.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      go build -trimpath \
        -ldflags "-s -w -X github.com/pocketbase/pocketbase.Version=$(craftctl get version)" \
        -o "$CRAFT_PART_INSTALL/bin/pocketbase" ./examples/base
      install -Dm644 LICENSE.md "$CRAFT_PART_INSTALL/share/doc/pocketbase/LICENSE"

  scripts:
    plugin: dump
    source: snap/local
